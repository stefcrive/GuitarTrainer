root_folder: null
output_folder: outputs
database_path: outputs/processor.sqlite
whisper_model: small
whisper_device: cpu
whisper_compute_type: int8
whisper_cpu_threads: 8 # omit to choose up to 8 threads automatically
whisper_num_workers: 1
language: auto
llm_provider: openai
llm_model: gpt-4o
marker_decision_provider: llm # llm or jev; both require OPENAI_API_KEY
jev_model: jev-latest # Jev also requires TYPESAFE_API_KEY
marker_preset: lessons # lessons, repertoire, devices
marker_prompt: "" # optional segmentation guidance, up to 4000 characters
transcription_mode: fast # fast: batches of 4; standard: sequential, same model/beam
max_videos_per_run: null
skip_existing: true
force_reprocess: false
audio_analysis_enabled: true
audio_analysis_window_seconds: 3
audio_analysis_hop_seconds: 1.5
audio_classifier: yamnet
chapter_min_count: 5
chapter_max_count: 14
chapter_boundary_pause_seconds: 2.5
chapter_min_duration_seconds: 45
chapter_target_seconds: 420
tag_max_count: 20
embedding_enabled: false
keep_audio_cache: false
guitar_trainer_export_enabled: true
guitar_trainer_db_path: null
guitar_trainer_merge_mode: preserve-existing
log_level: INFO
